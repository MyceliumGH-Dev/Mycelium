# Yak package manifest for Mycelium.
# The version here is the single source of truth for packaging (4-part X.Y.Z.W):
#   release channel     -> X.Y.Z.W
#   pre-release channel -> X.Y.Z-beta.W
# CI stamps the resolved channel version into the staged copy before `yak build`.
name: Mycelium
version: 0.1.0.4
authors:
  - Ilker Karadag, Patrick Kastner
description: >
  Generative urban massing for Grasshopper. Subdivide a parcel into blocks and
  streets, grow building typologies (courtyard, linear, point, L-shape, U-shape,
  tower), allocate parks and trees, and generate procedural terrain surfaces.

  Documentation: https://mycelium-gh-docs.netlify.app - Source:
  https://github.com/MyceliumGH-Dev/Mycelium
# Shown as the package's homepage in the Rhino Package Manager, so it points at the
# website; the repo is linked from the description above. Folded scalar (>) joins the
# lines of each paragraph, so keep related links in one paragraph.
url: https://mycelium-gh.netlify.app
icon: icon.png
keywords:
  - grasshopper
  - generative-design
  - urban-design
  - massing
  - architecture
  - parcel
  - terrain
  - synthetic-data
  - urban-morphology

name: Yak Pre-Release

on:
  push:
    branches:
      - pre-release
  workflow_dispatch:

jobs:
  publish:
    # Same grant as Yak Release; betas are tagged too, marked as GitHub pre-releases.
    permissions:
      contents: write
    uses: ./.github/workflows/_package.yml
    with:
      channel: pre-release
      publish: true
    secrets:
      YAK_TOKEN: ${{ secrets.YAK_TOKEN_PATRICK }}

name: Yak Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  publish:
    # contents: write is for the tag and GitHub Release the reusable workflow cuts after
    # Yak accepts the push. A reusable workflow can only narrow the caller's permissions,
    # never widen them, so the grant has to live here.
    permissions:
      contents: write
    uses: ./.github/workflows/_package.yml
    with:
      channel: release
      publish: true
    secrets:
      YAK_TOKEN: ${{ secrets.YAK_TOKEN_PATRICK }}

name: Package (reusable)

# Reusable Mycelium packaging pipeline (same scheme as Eddy3D). Builds the plugin,
# stages the Yak package, and runs `yak build` to validate it. With publish: true it
# also pushes to Yak and verifies; with publish: false (the dry-run) it stops after
# building the package and uploads it as an artifact — so packaging breakage is caught
# in PRs BEFORE it can reach a release branch. Called by package-check, yak-pre-release
# and yak-release so all three exercise the exact same build + staging logic (no drift).

on:
  workflow_call:
    inputs:
      channel:
        description: "'pre-release' (X.Y.Z-beta.W) or 'release' (X.Y.Z.W)"
        type: string
        default: 'pre-release'
      publish:
        description: 'Push to Yak (true) or dry-run build only (false)'
        type: boolean
        default: false
    secrets:
      YAK_TOKEN:
        description: 'Yak auth token; required only when publish is true'
        required: false

jobs:
  package:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_version: ${{ steps.version.outputs.source_version }}
    env:
      YAK_TOKEN: ${{ secrets.YAK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Read Mycelium version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content 'manifest.yml' -Raw
          $match = [regex]::Match($content, '(?m)^version:\s*(.+)$')
          if (-not $match.Success) { throw 'Could not read version from manifest.yml' }
          $fullVersion = $match.Groups[1].Value.Trim()
          $parts = $fullVersion -split '\.'
          if ($parts.Length -lt 4) { throw "Expected a 4-part version, got '$fullVersion'" }
          if ('${{ inputs.channel }}' -eq 'pre-release') {
            $version = "$($parts[0]).$($parts[1]).$($parts[2])-beta.$($parts[3])"
          } else {
            $version = $fullVersion
          }
          $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "assembly_version=$assemblyVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "source_version=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Channel '${{ inputs.channel }}' -> package version $version (assembly $assemblyVersion, templates branch $fullVersion)"

      - name: Guard against re-releasing a version
        shell: pwsh
        run: |
          # Every published version gets an immutable tag (see the release job). That makes
          # "has this version already gone out?" answerable, which the Yak version number
          # alone cannot answer once a release is cut. Two ways a version is spent:
          #   1. A tag exists on a DIFFERENT commit -> released from different content.
          #   2. Both distributions are already on Yak -> nothing left to push.
          # A tag on THIS commit is a re-run, and a partially-published version is the
          # deliberate mac-backfill case; both must stay allowed.
          $publish = '${{ inputs.publish }}' -eq 'true'
          $sha = '${{ github.sha }}'
          $source = '${{ steps.version.outputs.source_version }}'
          $p = $source -split '\.'

          $refs = @(git ls-remote --tags origin 2>$null)
          $yak = @()
          try {
            $yak = @(Invoke-RestMethod 'https://yak.rhino3d.com/versions/Mycelium' -ErrorAction Stop)
          } catch { Write-Host "Could not query Yak for existing distributions: $_" }

          function Get-Blocker($version) {
            $tag = "v$version"
            $e = [Regex]::Escape($tag)
            $peeled = @($refs | Where-Object { $_ -match "refs/tags/$e\^\{\}$" })
            $plain  = @($refs | Where-Object { $_ -match "refs/tags/$e$" })
            $tagSha = if ($peeled.Count) { ($peeled[0] -split "`t")[0] }
                      elseif ($plain.Count) { ($plain[0] -split "`t")[0] }
                      else { $null }

            $dists = @()
            $m = $yak | Where-Object { $_.version -eq $version }
            if ($m) { $dists = @($m.distributions | ForEach-Object { $_.filename }) }
            $hasWin = [bool]($dists | Where-Object { $_ -match '-win\.yak$' })
            $hasMac = [bool]($dists | Where-Object { $_ -match '-mac\.yak$' })

            if ($tagSha -eq $sha) {
              Write-Host "$tag already points at this commit - re-run, allowed."
              return $null
            }
            if ($tagSha) {
              return "$tag already exists on commit $tagSha. Version $version was released from different content; bump 'version:' in manifest.yml."
            }
            if ($hasWin -and $hasMac) {
              return "Yak already has both win and mac distributions for $version. Bump 'version:' in manifest.yml."
            }
            Write-Host "Version $version is releasable (tag: none, yak win: $hasWin, mac: $hasMac)."
            return $null
          }

          if ($publish) {
            # Only the channel actually being pushed can block the push.
            $reason = Get-Blocker '${{ steps.version.outputs.version }}'
            if ($reason) { throw $reason }
          } else {
            # The dry-run publishes nothing, so it checks BOTH channel spellings of the
            # manifest version. Checking only the called channel would mean a dev push
            # never warns about the release version - the one actually forgotten.
            foreach ($v in @($source, "$($p[0]).$($p[1]).$($p[2])-beta.$($p[3])")) {
              $reason = Get-Blocker $v
              # A warning, not a failure: an unbumped dev branch is the normal state
              # between releases, and this only describes its NEXT release.
              if ($reason) { Write-Host "::warning title=Version already released::$reason" }
            }
          }

      - name: Build plugin
        shell: pwsh
        run: |
          # AssemblyVersion gets the full 4-part manifest version: the template component
          # derives its Mycelium-Templates sync branch from it, so it must match the
          # branch name in that repo exactly (one branch per released version).
          dotnet build src/Mycelium/Mycelium.csproj -c Release `
            -p:Version=${{ steps.version.outputs.assembly_version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.source_version }}
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Prepare Yak package contents
        id: stage
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'yak-package'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $gha = Get-ChildItem -Path 'src/Mycelium/bin/Release' -Recurse -Filter 'Mycelium.gha' |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $gha) { throw 'Expected Mycelium.gha under src/Mycelium/bin/Release (build output missing)' }

          Copy-Item $gha.FullName $stage -Force
          Copy-Item 'docs/images/logo.png' (Join-Path $stage 'icon.png') -Force

          # Stamp the resolved channel version into the staged manifest.
          (Get-Content manifest.yml -Raw) -replace '(?m)^version:\s*.+$', 'version: ${{ steps.version.outputs.version }}' |
            Set-Content (Join-Path $stage 'manifest.yml')

          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download Yak CLI
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://files.mcneel.com/yak/tools/0.13.0/yak.exe' -OutFile 'yak.exe'

      - name: Build and publish Yak distributions (win + mac)
        shell: pwsh
        run: |
          $publish = '${{ inputs.publish }}' -eq 'true'
          if ($publish -and [string]::IsNullOrWhiteSpace($env:YAK_TOKEN)) {
            throw 'publish is true but YAK_TOKEN secret is empty.'
          }

          $stage = '${{ steps.stage.outputs.stage }}'
          $yak = "$env:GITHUB_WORKSPACE\yak.exe"
          $version = '${{ steps.version.outputs.version }}'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'yak-dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # The plugin loads on both Windows and Mac Rhino 8, so publish one distribution per
          # platform. Yak needs an explicit mac distribution or the Mac Package Manager hides
          # the package. Distributions are additive per version: before pushing we check the
          # server for an existing <version>-<platform> distribution and skip the push if it is
          # already there (idempotent; lets us backfill mac onto an existing win-only version).
          $existing = @()
          try {
            $vers = Invoke-RestMethod "https://yak.rhino3d.com/versions/Mycelium" -ErrorAction Stop
            $match = $vers | Where-Object { $_.version -eq $version }
            if ($match) { $existing = @($match.distributions | ForEach-Object { $_.filename }) }
          } catch { Write-Host "Could not query existing distributions: $_" }

          foreach ($platform in @('win', 'mac')) {
            Push-Location $stage
            try {
              Get-ChildItem -Filter '*.yak' | Remove-Item -Force -ErrorAction SilentlyContinue
              & $yak build --platform $platform
              if ($LASTEXITCODE -ne 0) { throw "yak build ($platform) failed with exit code $LASTEXITCODE" }
              $pkg = Get-ChildItem -Filter '*.yak' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if (-not $pkg) { throw "yak build ($platform) produced no .yak" }
              $dest = Join-Path $outDir $pkg.Name
              Copy-Item $pkg.FullName $dest -Force
              Write-Host "Built $platform distribution: $($pkg.Name)"
            } finally {
              Pop-Location
            }

            if ($publish) {
              if ($existing | Where-Object { $_ -match "-$platform\.yak$" }) {
                Write-Host "$platform distribution already published for $version - skipping push."
              } else {
                & $yak push $dest
                if ($LASTEXITCODE -ne 0) { throw "yak push ($platform) failed with exit code $LASTEXITCODE" }
                Write-Host "Pushed $platform distribution for $version."
              }
            }
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mycelium-yak-${{ steps.version.outputs.version }}
          path: ${{ github.workspace }}/yak-dist/*.yak
          if-no-files-found: error

      - name: Verify on Yak
        if: ${{ inputs.publish }}
        shell: pwsh
        run: |
          $packageName = 'Mycelium'
          $expectedVersion = '${{ steps.version.outputs.version }}'
          for ($i = 1; $i -le 12; $i++) {
            if ('${{ inputs.channel }}' -eq 'pre-release') {
              $result = & .\yak.exe search $packageName -a --prerelease 2>&1
            } else {
              $result = & .\yak.exe search $packageName -a 2>&1
            }
            $resultText = $result -join "`n"
            Write-Host $resultText
            if ($resultText -match [Regex]::Escape($expectedVersion)) {
              Write-Host "Verified on Yak: $packageName $expectedVersion"
              exit 0
            }
            Write-Host "Attempt ${i}/12: $expectedVersion not visible yet. Retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          throw "Yak verification failed: $packageName $expectedVersion not found."

  release:
    # Yak stays the distribution channel — this job does not change how anyone installs
    # Mycelium. It exists so every published version has an immutable git ref pointing at
    # the exact commit it was built from, which a Yak version number does not give you,
    # and which the re-release guard above reads back. Runs only after Yak accepted the
    # push, so a tag can never claim a release that did not actually publish.
    #
    # No `permissions:` block here on purpose. A called workflow's job may not request more
    # than the caller granted, and that is validated for EVERY job at startup — including
    # ones `if:` will skip. Declaring contents: write here fails Package Check outright,
    # since it runs on PRs (forks included) with a read-only token. The publishing callers
    # grant the write; this job inherits it.
    needs: package
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mycelium-yak-${{ needs.package.outputs.version }}
          path: yak-dist

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          SOURCE_VERSION: ${{ needs.package.outputs.source_version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          # The changelog is keyed by the 4-part manifest version in both channels, so a
          # beta reads the notes of the release it is a candidate for. index()==1 anchors
          # on the literal heading — no regex escaping of the [brackets].
          # sed drops the blank line that follows every changelog heading.
          notes=$(awk -v hdr="## [${SOURCE_VERSION}]" \
            'index($0,hdr)==1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="No CHANGELOG entry for ${SOURCE_VERSION}."
          fi
          notes="${notes}"$'\n\n'"Install with Rhino's Package Manager, or \`yak install Mycelium ${VERSION}\`."

          prerelease=false
          if [ "$CHANNEL" = "pre-release" ]; then prerelease=true; fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - refreshing its assets."
            gh release upload "$tag" yak-dist/*.yak --clobber
            exit 0
          fi

          gh release create "$tag" yak-dist/*.yak \
            --target "$GITHUB_SHA" \
            --title "Mycelium ${VERSION}" \
            --notes "$notes" \
            --prerelease="$prerelease"
          echo "Released $tag at $GITHUB_SHA"

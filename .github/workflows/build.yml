name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Mycelium.sln -c Release

      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Mycelium/Mycelium.csproj)).Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Assemble dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src/Mycelium/bin/Release/net7.0-windows/Mycelium.gha dist/
          Copy-Item -Recurse src/Mycelium/Templates dist/Templates
          Copy-Item docs/images/logo.png dist/icon.png
          (Get-Content src/Mycelium/manifest.yml) -replace '^version: .*', 'version: ${{ steps.version.outputs.version }}' | Set-Content dist/manifest.yml

      - name: Build Yak package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://files.mcneel.com/yak/tools/latest/yak.exe" -OutFile yak.exe
          cd dist
          ..\yak.exe build

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycelium-yak-package
          path: dist/*.yak

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" (Get-Item dist/*.yak) --title "Mycelium ${{ github.ref_name }}" --generate-notes

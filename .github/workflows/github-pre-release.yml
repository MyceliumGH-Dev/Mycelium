name: GitHub Pre-Release

on:
  push:
    branches:
      - pre-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content 'manifest.yml' -Raw
          $match = [regex]::Match($content, '(?m)^version:\s*(.+)$')
          if (-not $match.Success) { throw 'Could not read version from manifest.yml' }
          $fullVersion = $match.Groups[1].Value.Trim()
          $parts = $fullVersion -split '\.'
          if ($parts.Length -lt 4) { throw "Expected a 4-part version, got '$fullVersion'" }
          $preReleaseVersion = "$($parts[0]).$($parts[1]).$($parts[2])-beta.$($parts[3])"
          $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2])"
          "version=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pre_release_version=$preReleaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "assembly_version=$assemblyVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$preReleaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build src/Mycelium/Mycelium.csproj -c Release -p:Version=${{ steps.version.outputs.assembly_version }}
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Collect Release Assets
        id: assets
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'mycelium-prerelease'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $gha = Get-ChildItem -Path 'src/Mycelium/bin/Release' -Recurse -Filter 'Mycelium.gha' |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $gha) { throw 'Missing Mycelium.gha under src/Mycelium/bin/Release (build output missing)' }

          Copy-Item $gha.FullName $stage -Force
          Copy-Item 'manifest.yml' (Join-Path $stage 'manifest.yml') -Force
          Copy-Item 'docs/images/logo.png' (Join-Path $stage 'icon.png') -Force

          $assetName = "Mycelium-${{ steps.version.outputs.pre_release_version }}.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $assetName
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -Force
          "asset_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check If Tag Exists
        id: tag_check
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag ${tag} already exists. Skipping pre-release creation.`);
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Create GitHub Pre-Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Mycelium ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.assets.outputs.asset_path }}

      - name: Skip Existing Pre-Release
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} already exists. No new pre-release created."
